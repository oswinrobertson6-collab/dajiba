<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="figBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#figBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.25"/>
  <!-- Character "果" -->
  <text x="50%" y="53%" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="290" fill="#ffffff" text-anchor="middle" dominant-baseline="central" filter="url(#shadow)">果</text>
</svg>
